<div class="nv-wrap">

        <video class="nv-video" playsinline muted preload="auto" style="display:none"></video>
        <canvas class="nv-vidcanvas" width="480" height="300"></canvas>
      </div>
    </div>
    <div class="nv-panel nv-brainpanel">
      <div class="nv-panel-h nv-vizhead">◱ engagement signal</div>

  <script type="application/json" class="nv-payload">/*__PAYLOAD__*/null</script>
</div>
